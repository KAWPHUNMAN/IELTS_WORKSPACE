<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Dashboard — Kawphun</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root { color-scheme: light; }
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#EEF2F7;min-height:100vh;}

/* ── Header ── */
.hdr{background:linear-gradient(135deg,#1F4E79 0%,#2E75B6 100%);color:#fff;padding:18px 20px 14px;}
.hdr-top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;}
.hdr h1{font-size:17px;font-weight:700;letter-spacing:-.2px;}
.hdr-sub{font-size:11px;opacity:.75;margin-top:3px;}
.badge{background:rgba(255,255,255,.18);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

/* ── Layout ── */
.main{padding:14px;max-width:860px;margin:0 auto;}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.row1{margin-bottom:14px;}

/* ── Cards ── */
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.07);}
.card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#1F4E79;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #EEF2F7;}
.chart-wrap{position:relative;height:190px;}

/* ── Score cards ── */
.sc{text-align:center;background:#fff;border-radius:10px;padding:14px 8px;box-shadow:0 1px 3px rgba(0,0,0,.07);border-top:3px solid #ccc;}
.sc.green{border-top-color:#28a745;} .sc.amber{border-top-color:#ffc107;} .sc.red{border-top-color:#dc3545;}
.sc-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#888;margin-bottom:5px;}
.sc-val{font-size:26px;font-weight:800;line-height:1;color:#1F4E79;}
.sc.green .sc-val{color:#28a745;} .sc.red .sc-val{color:#dc3545;}
.sc-tgt{font-size:10px;color:#bbb;margin-top:3px;}
.tag{display:inline-block;margin-top:5px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;}
.green .tag{background:#d1e7dd;color:#155724;} .amber .tag{background:#fff3cd;color:#664d03;} .red .tag{background:#f8d7da;color:#721c24;}

/* ── Focus list ── */
.fi{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:12px;line-height:1.4;}
.fi:last-child{border-bottom:none;}
.fi-n{width:19px;height:19px;border-radius:50%;background:#dc3545;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}

/* ── Session log ── */
.si{display:flex;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid #f5f5f5;font-size:11px;}
.si:last-child{border-bottom:none;}
.si-n{width:22px;height:22px;border-radius:50%;background:#2E75B6;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.si-info{flex:1;}
.si-type{font-weight:700;color:#1F4E79;font-size:11px;}
.si-desc{color:#666;font-size:11px;margin-top:1px;}
.si-score{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.si-score.y{background:#d1e7dd;color:#155724;} .si-score.n{background:#f0f0f0;color:#aaa;}

/* ── Progress ── */
.prog-hdr{display:flex;justify-content:space-between;font-size:11px;color:#666;margin-bottom:6px;}
.prog-track{background:#e2e8f0;border-radius:20px;height:9px;}
.prog-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#2E75B6,#1F4E79);}

/* ── Phase indicator ── */
.phases{display:flex;gap:0;margin-bottom:14px;}
.ph{flex:1;padding:10px 6px;text-align:center;font-size:11px;font-weight:600;border-radius:0;}
.ph:first-child{border-radius:8px 0 0 8px;} .ph:last-child{border-radius:0 8px 8px 0;}
.ph.done{background:#1F4E79;color:#fff;}
.ph.active{background:#2E75B6;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);}
.ph.pending{background:#e2e8f0;color:#888;}
.ph-label{font-size:9px;font-weight:400;opacity:.85;margin-top:2px;}

@media(max-width:560px){.row4{grid-template-columns:repeat(2,1fr);}.row2{grid-template-columns:1fr;}}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════
     DATA — Update this block after each session
═══════════════════════════════════════════════ -->
<script>
const D = {
  lastUpdated:   "1 Jun 2026",
  currentSession: 5,
  totalSessions:  35,
  currentPhase:   "Phase 1",
  target:         7.0,

  /* Latest official IELTS scores */
  latest: { L:7.5, R:7.0, W:6.0, S:6.0 },

  /* Official test history — add more as needed */
  tests: [
    { label:"Test 1", L:8.0, R:5.5, W:5.5, S:6.0 },
    { label:"Test 2", L:6.5, R:6.0, W:6.0, S:5.5 },
    { label:"Test 3", L:7.5, R:7.0, W:6.0, S:6.0 },
  ],

  /* Writing criterion scores per assessed session (honest only) */
  writing: [
    { label:"Diagnostic", TA:6.0, CC:5.5, LR:5.0, GRA:5.5 },
    { label:"Session 3",  TA:6.5, CC:6.0, LR:5.5, GRA:5.5 },
    { label:"Session 5",  TA:6.5, CC:6.0, LR:5.5, GRA:5.0 },
  ],

  /* Current priority errors — update each session */
  focus: [
    "Causative verbs — 'make/let/help + object + base verb' (no 'to be') — 5 instances",
    "Plural nouns — always add -s to countable nouns",
    "Subject-verb agreement — match verb number to subject",
    "Unreal conditionals — 'if there were...' not 'if there is...'",
  ],

  /* Session log — add a row after each session */
  sessions: [
    { n:1, type:"Diagnostic",    desc:"Task 2 diagnostic essay",                  score:"5.5" },
    { n:2, type:"Skill Study",   desc:"Thesis statement + introduction rewrites",  score:null  },
    { n:3, type:"Full Essay",    desc:"Planning method + Discussion essay",        score:"6.0" },
    { n:4, type:"Skill Study",   desc:"Cohesion & coherence + paragraph rewrite",  score:null  },
    { n:5, type:"Full Essay",    desc:"Opinion essay — internet infrastructure",   score:"6.0" },
  ],
};
</script>
<!-- ══════════════════════════════════════════════ -->

<div class="hdr">
  <div class="hdr-top">
    <div>
      <h1>📊 IELTS Progress Dashboard</h1>
      <div class="hdr-sub">Kawphun — Academic Module</div>
    </div>
    <span class="badge" id="upd">—</span>
  </div>
  <div class="badges">
    <span class="badge">🎯 Target: Band 7.0–7.5</span>
    <span class="badge" id="s-badge">—</span>
    <span class="badge" id="ph-badge">—</span>
  </div>
</div>

<div class="main">

  <!-- Phase bar -->
  <div class="phases">
    <div class="ph active" id="ph1">Phase 1<div class="ph-label">Writing</div></div>
    <div class="ph pending" id="ph2">Phase 2<div class="ph-label">Speaking</div></div>
    <div class="ph pending" id="ph3">Phase 3<div class="ph-label">Integration</div></div>
  </div>

  <!-- Score cards -->
  <div class="row4" id="score-row"></div>

  <!-- Charts -->
  <div class="row2">
    <div class="card">
      <div class="card-title">📈 Official Test Score History</div>
      <div class="chart-wrap"><canvas id="histChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">✍️ Writing Criterion Progress</div>
      <div class="chart-wrap"><canvas id="wChart"></canvas></div>
    </div>
  </div>

  <!-- Focus + Sessions -->
  <div class="row2">
    <div class="card">
      <div class="card-title">🎯 Current Error Focus</div>
      <div id="focus-list"></div>
    </div>
    <div class="card">
      <div class="card-title">📋 Session Log</div>
      <div id="session-log"></div>
    </div>
  </div>

  <!-- Progress -->
  <div class="card row1">
    <div class="card-title">🗺️ Course Progress</div>
    <div class="prog-hdr">
      <span id="prog-lbl">—</span>
      <span id="prog-pct">—</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  </div>

</div>

<script>
/* ── Populate header ── */
document.getElementById("upd").textContent = "Updated: " + D.lastUpdated;
document.getElementById("s-badge").textContent = "Session " + D.currentSession + " / " + D.totalSessions;
document.getElementById("ph-badge").textContent = D.currentPhase;

/* ── Phase bar ── */
const phaseMap = { "Phase 1": 1, "Phase 2": 2, "Phase 3": 3 };
const cur = phaseMap[D.currentPhase] || 1;
for (let i = 1; i <= 3; i++) {
  const el = document.getElementById("ph" + i);
  el.className = "ph " + (i < cur ? "done" : i === cur ? "active" : "pending");
}

/* ── Score cards ── */
const skills = ["L","R","W","S"], names = {L:"Listening",R:"Reading",W:"Writing",S:"Speaking"};
const row = document.getElementById("score-row");
skills.forEach(sk => {
  const v = D.latest[sk], diff = v - D.target;
  const cls = diff >= 0 ? "green" : diff >= -0.5 ? "amber" : "red";
  const tag = diff >= 0 ? "✓ On Target" : "↑ " + Math.abs(diff).toFixed(1) + " needed";
  row.innerHTML += `<div class="sc ${cls}">
    <div class="sc-lbl">${names[sk]}</div>
    <div class="sc-val">${v.toFixed(1)}</div>
    <div class="sc-tgt">Target ${D.target.toFixed(1)}</div>
    <span class="tag">${tag}</span>
  </div>`;
});

/* ── History chart ── */
const clr = {
  L:{bg:"rgba(40,167,69,.65)",  b:"#28a745"},
  R:{bg:"rgba(23,162,184,.65)", b:"#17a2b8"},
  W:{bg:"rgba(220,53,69,.65)",  b:"#dc3545"},
  S:{bg:"rgba(255,193,7,.65)",  b:"#e0a800"},
};
new Chart(document.getElementById("histChart"), {
  type:"bar",
  data:{
    labels: D.tests.map(t=>t.label),
    datasets:[
      ...skills.map(sk=>({
        label: names[sk], data: D.tests.map(t=>t[sk]),
        backgroundColor: clr[sk].bg, borderColor: clr[sk].b,
        borderWidth:1.5, borderRadius:4,
      })),
      { label:"Target (7.0)", data: D.tests.map(()=>D.target),
        type:"line", borderColor:"#1F4E79", borderDash:[5,3],
        borderWidth:2, pointRadius:0, fill:false, tension:0 }
    ]
  },
  options:{
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{labels:{font:{size:10},boxWidth:11,padding:8}}},
    scales:{
      y:{min:4,max:9,ticks:{stepSize:1,font:{size:10}},grid:{color:"#f0f0f0"}},
      x:{ticks:{font:{size:10}},grid:{display:false}}
    }
  }
});

/* ── Writing criterion chart ── */
const wk = ["TA","CC","LR","GRA"], wl = ["Task Achievement","Coherence","Lexical Resource","Grammar"];
const wPalette = ["rgba(46,117,182,.7)","rgba(31,78,121,.8)","rgba(46,117,182,.4)"];
const wBorder  = ["#2E75B6","#1F4E79","#7bafd4"];
new Chart(document.getElementById("wChart"), {
  type:"bar",
  data:{
    labels: wl,
    datasets:[
      ...D.writing.map((w,i)=>({
        label: w.label, data: wk.map(k=>w[k]),
        backgroundColor: wPalette[i]||"rgba(150,150,150,.5)",
        borderColor: wBorder[i]||"#999",
        borderWidth:1.5, borderRadius:4,
      })),
      { label:"Band 7", data: wk.map(()=>7.0),
        type:"line", borderColor:"#dc3545", borderDash:[5,3],
        borderWidth:2, pointRadius:0, fill:false, tension:0 }
    ]
  },
  options:{
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{labels:{font:{size:10},boxWidth:11,padding:8}}},
    scales:{
      y:{min:4,max:8,ticks:{stepSize:.5,font:{size:10}},grid:{color:"#f0f0f0"}},
      x:{ticks:{font:{size:10},maxRotation:25},grid:{display:false}}
    }
  }
});

/* ── Focus list ── */
const fl = document.getElementById("focus-list");
D.focus.forEach((f,i) => {
  fl.innerHTML += `<div class="fi"><div class="fi-n">${i+1}</div><div>${f}</div></div>`;
});

/* ── Session log (newest first) ── */
const sl = document.getElementById("session-log");
[...D.sessions].reverse().forEach(s => {
  const has = s.score !== null;
  sl.innerHTML += `<div class="si">
    <div class="si-n">${s.n}</div>
    <div class="si-info">
      <div class="si-type">${s.type}</div>
      <div class="si-desc">${s.desc}</div>
    </div>
    <div class="si-score ${has?'y':'n'}">${has?"~"+s.score:"—"}</div>
  </div>`;
});

/* ── Progress bar ── */
const pct = Math.round(D.currentSession / D.totalSessions * 100);
document.getElementById("prog-fill").style.width = pct + "%";
document.getElementById("prog-pct").textContent = pct + "%";
document.getElementById("prog-lbl").textContent = D.currentSession + " of " + D.totalSessions + " sessions completed";
</script>
</body>
</html>
